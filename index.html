<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Donar - Entradas Clásico 2025</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #fafafa;
      color: #333;
      text-align: center;
      margin: 2rem;
    }
    .logo {
      width: 64px;
      height: 64px;
      object-fit: cover;
      vertical-align: middle;
      border-radius: 12px;
      margin: 0 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    h1 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 1.4rem;
    }
    img.main-img {
      max-width: 320px;
      width: 100%;
      border-radius: 16px;
      margin: 1.5rem auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      display: block;
    }
    a.donate-btn {
      display: inline-block;
      padding: 1rem 2rem;
      background-color: #0070ba;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.3s;
    }
    a.donate-btn:hover {
      background-color: #005c99;
    }
  </style>
</head>
<body>
  <h1>
    <img src="http://i.ibb.co/FnGwW1c/Logo.png" alt="Logo del club" class="logo" />
    ESTA VEZ ES GRATIS!! 
    <img src="http://i.ibb.co/FnGwW1c/Logo.png" alt="Logo del club" class="logo" />
  </h1>

  <p>PERO SI QUIERES ME PUEDES INVITAR A UNA CERVEZA!!</p>

  <img
    src="https://em-content.zobj.net/source/apple/76/face-with-tears-of-joy_1f602.png"
    alt="Apóyanos con una donación"
    class="main-img"
  />

  <!-- Botón directo -->
  <a href="https://supervectar-coder.github.io/SUPERACE/" target="_blank" class="donate-btn">
    ENTRAR A SUPERVECTAR DEPORTES
  </a>
</body>
</html>
